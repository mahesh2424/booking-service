spring.datasource.url=jdbc:h2:mem:booking-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
ticketing.inventory.backend=jpa
ticketing.holds.expiry-scan-ms=3600000
ticketing.outbox.lock-clause=FOR UPDATE
ticketing.redis.enabled=false
ticketing.kafka.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
