spring.application.name=booking-service
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/booking
spring.datasource.username=ticketing
spring.datasource.password=${DB_PASSWORD:ticketing}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
ticketing.inventory.backend=jdbc
ticketing.holds.expiry-scan-ms=30000
ticketing.outbox.lock-clause=FOR UPDATE SKIP LOCKED
ticketing.outbox.poll-ms=1000
ticketing.redis.enabled=false
ticketing.kafka.enabled=false
ticketing.kafka.topic=booking.reservation-events
ticketing.kafka.dlq-topic=booking.reservation-events.dlq
ticketing.rate-limit.holds-per-minute=30
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
